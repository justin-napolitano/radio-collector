# Minimal Nginx reverse proxy for Radio Collector
# - HTTP->backend pass-through
# - Works for HLS/streaming and API requests
# - Add TLS in a real deployment (see commented server block below)

# Upstream (the app container service name from compose)
upstream radio_backend {
    server radio-collector:8080;
    keepalive 64;
}

# HTTP server (port 80). In production, redirect to HTTPS or put behind a TLS terminator.
server {
    listen 80;
    server_name _;

    # Uncomment to redirect all HTTP to HTTPS
    # return 301 https://$host$request_uri;

    # Proxy common headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Increase timeouts for live streams
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;

    # Gzip static
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Pass everything to the app; it serves static + SPA + /api proxy
    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://radio_backend;
    }

    # Optional: do NOT cache healthz
    location = /healthz {
        proxy_pass http://radio_backend;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}

