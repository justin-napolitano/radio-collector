services:
  radio-collector:
    build: .
    image: radio-collector:latest
    container_name: radio-collector
    ports:
      - "8083:8080"
    environment:
      - RADIO_BROWSER_BASE=https://de1.api.radio-browser.info
      - PORT=8080
    
restart: unless-stopped
# --- Reverse proxy labels (uncomment and adjust) ---
# Traefik v2 example:
labels:
  - "traefik.enable=true"
  # Change to your domain:
  - "traefik.http.routers.radio-collector.rule=Host(`192.168.1.115`)"
  - "traefik.http.routers.radio-collector.entrypoints=websecure"
  - "traefik.http.routers.radio-collector.tls.certresolver=letsencrypt"
  - "traefik.http.services.radio-collector.loadbalancer.server.port=8080"
# Caddy (with caddy-docker-proxy) example:
  - "caddy=192.168.1.115"
  - "caddy.encode=gzip zstd"
  - "caddy.reverse_proxy={{upstreams 8080}}"



# Healthcheck for docker-compose
# (Dockerfile already has one; keeping here for clarity/overrides)
# Uses curl inside the container
healthcheck:
  test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 15s
