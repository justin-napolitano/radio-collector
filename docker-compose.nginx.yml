services:
  radio-collector:
    build: .
    image: radio-collector:latest
    container_name: radio-collector
    expose:
      - "8080"
    environment:
      - RADIO_BROWSER_BASE=https://de1.api.radio-browser.info
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    container_name: radio-collector-nginx
    depends_on:
      radio-collector:
        condition: service_healthy
    ports:
      - "80:80"
      # Uncomment and mount certs for HTTPS
      # - "443:443"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount TLS certs if using HTTPS:
      # - ./reverse-proxy/certs:/etc/nginx/certs:ro
    restart: unless-stopped
